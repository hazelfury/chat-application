{% extends "base.html" %}
{% block title %}DM with {{ other_user.username }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <a href="{% url 'dm_inbox' %}" class="text-muted text-decoration-none small">← Back to DMs</a>
    <h3 class="fw-bold mb-0 mt-1">💬 {{ other_user.username }}</h3>
  </div>
  <span class="badge text-bg-success">Live</span>
</div>

<div class="card border-0 shadow-sm" style="border-radius:14px; overflow:hidden;">
  <div id="dm-log" style="height:420px; overflow-y:auto; padding:20px; background:#fff; display:flex; flex-direction:column; gap:8px;"></div>
  <div class="card-footer bg-white border-top d-flex gap-2 p-3">
    <input id="dm-input" type="text" class="form-control" placeholder="Type a message…" autocomplete="off"/>
    <button id="send-btn" class="btn btn-brand px-4">Send</button>
  </div>
</div>

<style>
  .msg-bubble { max-width:72%; padding:8px 14px; border-radius:18px; font-size:.9rem; }
  .msg-own { background:#6C63FF; color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .msg-other { background:#F3F4F6; color:#111; align-self:flex-start; border-bottom-left-radius:4px; }
  .msg-meta { font-size:.72rem; opacity:.65; margin-bottom:2px; }
</style>

<script>
  const otherUsername = "{{ other_user.username }}";
  const currentUser = "{{ request.user.username }}";
  const wsUrl = `ws://${window.location.host}/ws/dm/${otherUsername}/`;
  const socket = new WebSocket(wsUrl);
  const log = document.getElementById('dm-log');

  function appendMessage(sender, message, timestamp) {
    const own = sender === currentUser;
    const wrapper = document.createElement('div');
    wrapper.style.cssText = `display:flex; flex-direction:column; align-items:${own ? 'flex-end' : 'flex-start'};`;

    const meta = document.createElement('span');
    meta.className = 'msg-meta';
    meta.textContent = own ? `You · ${timestamp}` : `${sender} · ${timestamp}`;
    wrapper.appendChild(meta);

    const bubble = document.createElement('div');
    bubble.className = `msg-bubble ${own ? 'msg-own' : 'msg-other'}`;
    bubble.textContent = message;
    wrapper.appendChild(bubble);
    log.appendChild(wrapper);
    log.scrollTop = log.scrollHeight;
  }

  function appendSeparator(text) {
    const el = document.createElement('div');
    el.style.cssText = 'text-align:center; color:#9CA3AF; font-size:11px; margin:8px 0; border-top:1px solid #E5E7EB; padding-top:8px;';
    el.textContent = text;
    log.appendChild(el);
  }

  socket.onmessage = e => {
    const data = JSON.parse(e.data);
    if (data.type === 'separator') {
      appendSeparator(data.message);
    } else {
      appendMessage(data.sender, data.message, data.timestamp);
    }
  };

  document.getElementById('send-btn').onclick = sendMessage;
  document.getElementById('dm-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });

  function sendMessage() {
    const input = document.getElementById('dm-input');
    const msg = input.value.trim();
    if (msg && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ message: msg }));
      input.value = '';
    }
  }
</script>
{% endblock %}
