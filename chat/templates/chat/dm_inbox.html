{% extends "base.html" %}
{% block title %}Direct Messages{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fw-bold mb-0">💬 Direct Messages</h2>
  <a href="/" class="btn btn-outline-secondary btn-sm">← Back to Rooms</a>
</div>
<div class="row g-3">
  {% for user in users %}
  <div class="col-md-4">
    <a href="{% url 'dm_conversation' user.username %}" class="text-decoration-none">
      <div class="card border-0 shadow-sm p-3" style="border-radius:12px; transition:.2s;"
        onmouseover="this.style.transform='translateY(-3px)'"
        onmouseout="this.style.transform=''">
        <div class="d-flex align-items-center gap-3">
          <div style="width:40px;height:40px;background:#6C63FF;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;">
            {{ user.username|first|upper }}
          </div>
          <div>
            <h6 class="mb-0 fw-semibold text-dark">{{ user.username }}</h6>
            <small class="text-muted">Click to message</small>
          </div>
        </div>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
{% endblock %}
